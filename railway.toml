[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "node src/app.js"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

[[services]]
  name = "team-task-manager"

[service.variables]
  NODE_ENV = "production"
  JWT_EXPIRES_IN = "7d"
  DATA_DIR = "/data"
